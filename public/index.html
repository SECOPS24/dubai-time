<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dubai Time</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .flag { font-size: 64px; margin-bottom: 12px; }
    .city { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #e2a94b; margin-bottom: 8px; }
    .country { font-size: 22px; font-weight: 300; color: rgba(255,255,255,0.7); margin-bottom: 32px; }
    .time {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f7c948, #e2a94b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .date {
      font-size: 15px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 28px;
    }
    .tz-badge {
      display: inline-block;
      background: rgba(226,169,75,0.15);
      border: 1px solid rgba(226,169,75,0.3);
      color: #e2a94b;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="flag">🇦🇪</div>
    <div class="city">Dubai</div>
    <div class="country">United Arab Emirates</div>
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date">Loading...</div>
    <div class="tz-badge"><span class="dot"></span>Gulf Standard Time · UTC+4</div>
  </div>

  <script>
    async function updateTime() {
      try {
        const res = await fetch('/api/time');
        const data = await res.json();
        document.getElementById('time').textContent = data.time;
        document.getElementById('date').textContent = data.date;
      } catch (e) {
        // fallback to client-side
        const now = new Date();
        document.getElementById('time').textContent = now.toLocaleTimeString('en-US', {
          hour: '2-digit', minute: '2-digit', second: '2-digit',
          hour12: true, timeZone: 'Asia/Dubai'
        });
        document.getElementById('date').textContent = now.toLocaleDateString('en-US', {
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
          timeZone: 'Asia/Dubai'
        });
      }
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
